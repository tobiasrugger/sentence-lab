<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence Lab — Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16232B; --paper:#EDF0EF; --surface:#fff; --line:#D2D9D7; --muted:#5F706C;
  --green:#2F7D4F; --yellow:#B8860B; --red:#A93A3A; --blue:#2F6FA8; --none:#DFE4E3;
  --teal:#1B6B58;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:15px;line-height:1.5}
.top{background:var(--ink);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.top h1{font-size:17px;margin:0;font-weight:700}
.top nav{display:flex;gap:4px;margin-left:8px}
.top nav button{background:transparent;border:0;color:#9FB0AC;font:inherit;padding:7px 13px;border-radius:5px;cursor:pointer}
.top nav button.on{background:rgba(255,255,255,.13);color:#fff;font-weight:700}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
select,input[type=text],input[type=password]{font:inherit;padding:7px 9px;border:1.5px solid var(--line);border-radius:5px;background:#fff;color:var(--ink)}
main{padding:24px;max-width:1400px;margin:0 auto}
h2{font-size:16px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-size:14px;max-width:70ch}

table{border-collapse:collapse;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{background:#F6F8F7;font-weight:700;position:sticky;top:0;font-size:13px}
tbody tr:hover{background:#F6F8F7}
.num{text-align:right;font-variant-numeric:tabular-nums}

.sq{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:5px;
  background:var(--none);color:#fff;font-size:13px;cursor:pointer;border:0;font-family:inherit}
.sq.green{background:var(--green)}.sq.yellow{background:var(--yellow)}
.sq.red{background:var(--red)}.sq.blue{background:var(--blue)}
.sq.empty{background:var(--none);cursor:default}
.sq sup{font-size:9px;margin-left:1px;opacity:.85}

.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.pill.green{background:var(--green)}.pill.yellow{background:var(--yellow)}.pill.red{background:var(--red)}
.pill.grey{background:#8B9A96}

.key{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 16px;font-size:13px;color:var(--muted)}
.key span{display:flex;align-items:center;gap:6px}
.key i{width:13px;height:13px;border-radius:3px;display:inline-block}

.att{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:12px}
.att .q{font-weight:700;margin:0 0 10px}
.att ol{margin:0;padding-left:22px}
.att li{margin-bottom:9px}
.att .resp{font-size:15px}
.att .fb{color:var(--muted);font-size:13px}
.att li.ok .resp{color:var(--green);font-weight:700}
.bars{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--none);min-width:110px}
.bars b{display:block;height:100%}
.mom{font-variant-numeric:tabular-nums;font-weight:700}
.mom.up{color:var(--green)}.mom.down{color:var(--red)}.mom.flat{color:var(--muted)}
.gate{max-width:340px;margin:110px auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:26px}
.gate button,.btn{font:inherit;font-weight:700;background:var(--ink);color:#fff;border:0;border-radius:5px;padding:9px 16px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);font-weight:400}
.empty{color:var(--muted);padding:40px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:6px}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<div id="root"></div>

<script src="content.js"></script>
<script>
var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var PASSWORD='galileo2026';

var DATA={sessions:[],attempts:[]};
var VIEW='summary', PERIOD='all', FOCUS=null;
var root=document.getElementById('root');

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function h(){return {apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY};}
function get(t,q){return fetch(SUPA_URL+'/rest/v1/'+t+'?'+q,{headers:h()}).then(function(r){return r.json();}).catch(function(){return [];});}

/* ---------- gate ---------- */
function gate(){
  root.innerHTML='<div class="gate"><h2>Sentence Lab reports</h2>'
    +'<p class="sub">Teacher access.</p>'
    +'<input type="password" id="pw" style="width:100%" placeholder="Password">'
    +'<div style="margin-top:14px"><button id="in">Open reports</button></div></div>';
  var go=function(){
    if(document.getElementById('pw').value===PASSWORD){ sessionStorage.setItem('qf_t','1'); boot(); }
    else { document.getElementById('pw').value=''; document.getElementById('pw').focus(); }
  };
  document.getElementById('in').onclick=go;
  document.getElementById('pw').onkeydown=function(e){ if(e.key==='Enter') go(); };
  document.getElementById('pw').focus();
}

/* ---------- load ---------- */
function boot(){
  root.innerHTML='<div class="empty">Loading…</div>';
  Promise.all([
    get('qf_sessions','select=*&order=started_at.desc&limit=5000'),
    get('qf_attempts','select=*&order=created_at.asc&limit=20000')
  ]).then(function(res){
    DATA.sessions=res[0]||[]; DATA.attempts=res[1]||[];
    draw();
  });
}

/* ---------- helpers ---------- */
function periods(){
  var m={}; DATA.sessions.forEach(function(s){ if(s.class_period) m[s.class_period]=1; });
  return Object.keys(m).sort();
}
function sessionsIn(){
  return DATA.sessions.filter(function(s){ return PERIOD==='all' || s.class_period===PERIOD; });
}
function students(){
  var m={}; sessionsIn().forEach(function(s){ m[s.student_name]=1; });
  return Object.keys(m).sort();
}
function activities(){
  var order=[], seen={};
  QF_CONTENT.activities.forEach(function(a){ order.push({id:a.id,title:a.title,tool:a.tool}); seen[a.id]=1; });
  sessionsIn().forEach(function(s){
    if(!seen[s.activity_id]){ seen[s.activity_id]=1; order.push({id:s.activity_id,title:s.activity_title||s.activity_id,tool:s.tool}); }
  });
  return order;
}
function bestSession(student, actId){
  var rows=sessionsIn().filter(function(s){ return s.student_name===student && s.activity_id===actId && s.completed_at; });
  if(!rows.length) return null;
  rows.sort(function(a,b){ return (b.percent||0)-(a.percent||0); });
  return {best:rows[0], plays:rows.length};
}
function skillLabel(k){ return (QF_CONTENT.skills && QF_CONTENT.skills[k]) || k || '—'; }
function toolMark(t){
  return t==='combine'?'◎':(t==='write'?'✎':(t==='blank'?'▭':(t==='proof'?'⚑':'·')));
}

/* ---------- chrome ---------- */
function shell(inner){
  var ps=periods(), opts='<option value="all">All periods</option>';
  ps.forEach(function(p){ opts+='<option value="'+esc(p)+'"'+(p===PERIOD?' selected':'')+'>Period '+esc(p)+'</option>'; });
  root.innerHTML=
    '<div class="top"><h1>Sentence Lab</h1><nav>'
    +'<button data-v="summary" class="'+(VIEW==='summary'?'on':'')+'">Activity summary</button>'
    +'<button data-v="analysis" class="'+(VIEW==='analysis'?'on':'')+'">Responses</button>'
    +'<button data-v="skills" class="'+(VIEW==='skills'?'on':'')+'">Skills</button>'
    +'</nav><div class="right"><select id="per">'+opts+'</select>'
    +'<button class="btn ghost" id="csv">Export CSV</button>'
    +'<button class="btn ghost" id="rl">Refresh</button></div></div><main>'+inner+'</main>';

  var nb=root.querySelectorAll('nav button');
  for(var i=0;i<nb.length;i++){ nb[i].onclick=function(){ VIEW=this.getAttribute('data-v'); FOCUS=null; draw(); }; }
  document.getElementById('per').onchange=function(){ PERIOD=this.value; draw(); };
  document.getElementById('rl').onclick=boot;
  document.getElementById('csv').onclick=exportCsv;
}

function draw(){
  if(VIEW==='summary') return drawSummary();
  if(VIEW==='analysis') return drawAnalysis();
  return drawSkills();
}

/* ============================================================
   1. ACTIVITY SUMMARY — students x activities, colored squares
   ============================================================ */
function drawSummary(){
  var studs=students(), acts=activities();
  if(!studs.length){ return shell('<div class="empty">No student work yet. Once students finish an activity it shows up here.</div>'); }

  var head='<th style="min-width:150px">Student</th>';
  acts.forEach(function(a){
    head+='<th title="'+esc(a.title)+'">'+toolMark(a.tool)+' '+esc(a.title.length>18?a.title.slice(0,17)+'…':a.title)+'</th>';
  });
  head+='<th class="num">Done</th>';

  var body='';
  studs.forEach(function(st){
    var row='<tr><td><b>'+esc(st)+'</b></td>', done=0;
    acts.forEach(function(a){
      var r=bestSession(st,a.id);
      if(!r){ row+='<td><span class="sq empty"></span></td>'; return; }
      done++;
      var reps=r.plays>1?'<sup>'+r.plays+'</sup>':'';
      row+='<td><button class="sq '+(r.best.proficiency||'blue')+'" data-s="'+esc(st)+'" data-a="'+esc(a.id)+'">'
          +(r.best.percent==null?'':r.best.percent)+reps+'</button></td>';
    });
    row+='<td class="num">'+done+'/'+acts.length+'</td></tr>';
    body+=row;
  });

  shell('<h2>Activity summary</h2>'
    +'<p class="sub">One square per student per activity, colored by proficiency. A small number in the corner means the student replayed it — the square shows their best result. Click any square to read what they actually wrote.</p>'
    +'<div class="key">'
    +'<span><i style="background:var(--green)"></i>Frequently demonstrated · 83–100%</span>'
    +'<span><i style="background:var(--yellow)"></i>Sometimes demonstrated · 32–82%</span>'
    +'<span><i style="background:var(--red)"></i>Rarely demonstrated · 0–31%</span>'
    +'<span><i style="background:var(--none)"></i>Not started</span>'
    +'<span>◎ combine ✎ write ▭ blank ⚑ proofread</span>'
    +'</div>'
    +'<div class="scroll"><table><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>');

  var sqs=root.querySelectorAll('.sq[data-s]');
  for(var i=0;i<sqs.length;i++){
    sqs[i].onclick=function(){
      FOCUS={student:this.getAttribute('data-s'), activity:this.getAttribute('data-a')};
      VIEW='analysis'; draw();
    };
  }
}

/* ============================================================
   2. RESPONSES — the attempt transcript
   ============================================================ */
function drawAnalysis(){
  var studs=students(), acts=activities();
  var st=FOCUS?FOCUS.student:(studs[0]||'');
  var ac=FOCUS?FOCUS.activity:(acts[0]?acts[0].id:'');

  var sOpts=''; studs.forEach(function(x){ sOpts+='<option'+(x===st?' selected':'')+'>'+esc(x)+'</option>'; });
  var aOpts=''; acts.forEach(function(x){ aOpts+='<option value="'+esc(x.id)+'"'+(x.id===ac?' selected':'')+'>'+esc(x.title)+'</option>'; });

  var rows=DATA.attempts.filter(function(r){ return r.student_name===st && r.activity_id===ac; });
  var sess=sessionsIn().filter(function(s){ return s.student_name===st && s.activity_id===ac && s.completed_at; });

  var byPrompt={}, order=[];
  rows.forEach(function(r){
    if(!byPrompt[r.prompt_id]){ byPrompt[r.prompt_id]=[]; order.push(r.prompt_id); }
    byPrompt[r.prompt_id].push(r);
  });

  var out='';
  if(!order.length){ out='<div class="empty">No responses recorded for this student and activity.</div>'; }
  order.forEach(function(pid){
    var list=byPrompt[pid], got=list.some(function(x){return x.is_optimal;});
    var items='';
    list.forEach(function(r){
      items+='<li class="'+(r.is_optimal?'ok':'')+'">'
        +'<div class="resp">'+esc(r.response||'(blank)')+'</div>'
        +(r.feedback?'<div class="fb">'+esc(r.feedback)+'</div>':'')+'</li>';
    });
    out+='<div class="att"><p class="q">'+esc(pid)+' · '+esc(skillLabel(list[0].skill))
       +' · '+(got?'<span class="pill green">reached it</span>':'<span class="pill red">did not reach it</span>')
       +' · '+list.length+' attempt'+(list.length===1?'':'s')+'</p><ol>'+items+'</ol></div>';
  });

  var hdr='';
  sess.forEach(function(s){
    hdr+='<span class="pill '+(s.proficiency||'grey')+'" style="margin-right:6px">try '+s.replay_number+' · '+(s.percent==null?'—':s.percent+'%')+'</span>';
  });

  shell('<h2>Responses</h2>'
    +'<p class="sub">Every attempt a student made, in order, with the feedback they were shown. This is the view to open during a conference — the revision path tells you more than the score does.</p>'
    +'<div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">'
    +'<select id="fs">'+sOpts+'</select><select id="fa">'+aOpts+'</select>'
    +'<div style="margin-left:auto">'+hdr+'</div></div>'+out);

  document.getElementById('fs').onchange=function(){ FOCUS={student:this.value,activity:ac}; draw(); };
  document.getElementById('fa').onchange=function(){ FOCUS={student:st,activity:this.value}; draw(); };
}

/* ============================================================
   3. SKILLS — exposure, accuracy, momentum, replay
   ============================================================ */
function skillStats(){
  var rows=DATA.attempts.filter(function(r){
    if(PERIOD==='all') return true;
    return r.class_period===PERIOD;
  });
  /* group by student+skill+prompt so a prompt counts once */
  var promptMap={};
  rows.forEach(function(r){
    if(!r.skill) return;
    var k=r.student_name+'||'+r.skill+'||'+r.activity_id+'||'+r.prompt_id;
    if(!promptMap[k]) promptMap[k]={student:r.student_name,skill:r.skill,tries:0,ok:false,t:r.created_at};
    promptMap[k].tries++;
    if(r.is_optimal) promptMap[k].ok=true;
    if(r.created_at>promptMap[k].t) promptMap[k].t=r.created_at;
  });
  var byPair={};
  Object.keys(promptMap).forEach(function(k){
    var p=promptMap[k], key=p.student+'||'+p.skill;
    if(!byPair[key]) byPair[key]={student:p.student,skill:p.skill,items:[]};
    byPair[key].items.push(p);
  });
  var out=[];
  Object.keys(byPair).forEach(function(key){
    var v=byPair[key];
    v.items.sort(function(a,b){ return a.t<b.t?-1:1; });
    var n=v.items.length;
    var ok=v.items.filter(function(i){return i.ok;}).length;
    var acc=Math.round(ok/n*100);
    var half=Math.floor(n/2);
    var mom=null;
    if(n>=4){
      var early=v.items.slice(0,half), late=v.items.slice(half);
      var e=Math.round(early.filter(function(i){return i.ok;}).length/early.length*100);
      var l=Math.round(late.filter(function(i){return i.ok;}).length/late.length*100);
      mom=l-e;
    }
    var effort=(v.items.reduce(function(s,i){return s+i.tries;},0)/n);
    out.push({student:v.student,skill:v.skill,exposure:n,accuracy:acc,momentum:mom,effort:effort});
  });
  return out;
}
function replayRate(student){
  var rows=sessionsIn().filter(function(s){ return s.student_name===student && s.completed_at; });
  var byAct={}; rows.forEach(function(s){ byAct[s.activity_id]=(byAct[s.activity_id]||0)+1; });
  var keys=Object.keys(byAct); if(!keys.length) return null;
  var repl=keys.filter(function(k){return byAct[k]>1;}).length;
  return Math.round(repl/keys.length*100);
}

function drawSkills(){
  var stats=skillStats();
  if(!stats.length){ return shell('<div class="empty">No skill data yet.</div>'); }

  /* --- smart groups per student --- */
  var byStudent={};
  stats.forEach(function(s){
    if(!byStudent[s.student]) byStudent[s.student]={n:0,ok:0,exp:0,skills:[]};
    var b=byStudent[s.student];
    b.n++; b.ok+=s.accuracy; b.exp+=s.exposure; b.skills.push(s);
  });
  var groups={meet:[],approach:[],support:[]};
  Object.keys(byStudent).forEach(function(st){
    var avg=Math.round(byStudent[st].ok/byStudent[st].n);
    byStudent[st].avg=avg;
    if(avg>=83) groups.meet.push(st); else if(avg>=32) groups.approach.push(st); else groups.support.push(st);
  });

  var cards='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:24px">';
  [['Meeting goal','green',groups.meet],['Approaching goal','yellow',groups.approach],['Needs support','red',groups.support]]
  .forEach(function(g){
    cards+='<div class="att"><p class="q"><span class="pill '+g[1]+'">'+g[0]+'</span> '+g[2].length+'</p>'
      +'<div style="font-size:14px;color:var(--muted)">'+(g[2].length?esc(g[2].join(', ')):'nobody yet')+'</div></div>';
  });
  cards+='</div>';

  /* --- skill x class table --- */
  var bySkill={};
  stats.forEach(function(s){
    if(!bySkill[s.skill]) bySkill[s.skill]={n:0,acc:0,exp:0,notYet:[]};
    var b=bySkill[s.skill]; b.n++; b.acc+=s.accuracy; b.exp+=s.exposure;
    if(s.accuracy<83) b.notYet.push(s.student);
  });
  var srows='';
  Object.keys(bySkill).sort().forEach(function(k){
    var b=bySkill[k], avg=Math.round(b.acc/b.n);
    var cls=avg>=83?'green':(avg>=32?'yellow':'red');
    srows+='<tr><td><b>'+esc(skillLabel(k))+'</b></td>'
      +'<td class="num">'+b.n+'</td>'
      +'<td class="num">'+b.exp+'</td>'
      +'<td><div class="bars" style="width:130px"><b style="width:'+avg+'%;background:var(--'+cls+')"></b></div></td>'
      +'<td class="num">'+avg+'%</td>'
      +'<td>'+(b.notYet.length?esc(b.notYet.join(', ')):'—')+'</td></tr>';
  });

  /* --- student x skill detail --- */
  var drows='';
  stats.sort(function(a,b){ return a.student<b.student?-1:(a.student>b.student?1:(a.skill<b.skill?-1:1)); });
  stats.forEach(function(s){
    var cls=s.accuracy>=83?'green':(s.accuracy>=32?'yellow':'red');
    var m = s.momentum===null ? '<span class="mom flat">—</span>'
      : '<span class="mom '+(s.momentum>0?'up':(s.momentum<0?'down':'flat'))+'">'
        +(s.momentum>0?'+':'')+s.momentum+'</span>';
    var rr=replayRate(s.student);
    drows+='<tr><td>'+esc(s.student)+'</td><td>'+esc(skillLabel(s.skill))+'</td>'
      +'<td class="num">'+s.exposure+'</td>'
      +'<td><span class="pill '+cls+'">'+s.accuracy+'%</span></td>'
      +'<td class="num">'+m+'</td>'
      +'<td class="num">'+s.effort.toFixed(1)+'</td>'
      +'<td class="num">'+(rr===null?'—':rr+'%')+'</td></tr>';
  });

  shell('<h2>Skills</h2>'
    +'<p class="sub">Exposure is counted separately from accuracy, so a low score reads differently depending on whether a student has met the skill twice or twenty times. Momentum compares the second half of a student\'s practice on a skill against the first half — it is the number to watch for newcomers whose absolute accuracy will stay low for a while. Tries is the average number of attempts needed to reach a correct answer.</p>'
    +cards
    +'<h2 style="margin-top:8px">By skill</h2><p class="sub">Where the whole class stands.</p>'
    +'<div class="scroll"><table><thead><tr><th>Skill</th><th class="num">Students</th><th class="num">Prompts seen</th><th>Class accuracy</th><th class="num">%</th><th>Not yet proficient</th></tr></thead><tbody>'+srows+'</tbody></table></div>'
    +'<h2 style="margin-top:26px">By student</h2><p class="sub">Every student-skill pair with data.</p>'
    +'<div class="scroll"><table><thead><tr><th>Student</th><th>Skill</th><th class="num">Exposure</th><th>Accuracy</th><th class="num">Momentum</th><th class="num">Tries</th><th class="num">Replay rate</th></tr></thead><tbody>'+drows+'</tbody></table></div>');
}

/* ============================================================
   CSV EXPORT — raw attempts
   ============================================================ */
function exportCsv(){
  var rows=DATA.attempts.filter(function(r){ return PERIOD==='all'||r.class_period===PERIOD; });
  var cols=['created_at','student_name','class_period','activity_id','prompt_id','attempt_number','response','feedback','is_optimal','skill','standard'];
  var lines=[cols.join(',')];
  rows.forEach(function(r){
    var out=cols.map(function(c){
      var v=r[c]==null?'':String(r[c]);
      return '"'+v.replace(/"/g,'""')+'"';
    });
    lines.push(out.join(','));
  });
  var blob=new Blob([lines.join('\n')],{type:'text/csv'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='sentence-lab-attempts.csv';
  a.click();
}

/* ---------- boot ---------- */
if(sessionStorage.getItem('qf_t')==='1') boot(); else gate();
</script>
</body>
</html>
