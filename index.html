<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16232B;--paper:#EDF0EF;--surface:#fff;--line:#D2D9D7;--muted:#5F706C;--teal:#1B6B58}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:18px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:34px 18px 80px}
header{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:28px}
h1{font-size:30px;margin:0 0 4px;letter-spacing:-.02em}
header p{margin:0;color:var(--muted);font-size:16px}
h2{font-size:15px;color:var(--muted);font-weight:400;margin:30px 0 10px}
a.act{
  display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ink);
  border-radius:6px;padding:14px 16px;margin-bottom:8px;
}
a.act:hover,a.act:focus-visible{border-left-color:var(--teal);outline:none;background:#F7FAF9}
a.act .mark{font-size:20px;width:24px;text-align:center;color:var(--muted)}
a.act .t{font-weight:700}
a.act .m{font-size:14px;color:var(--muted)}
a.act .lv{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:14px}
footer a{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="ttl">Sentence Lab</h1>
    <p id="sub"></p>
  </header>
  <div id="list"></div>
  <footer><a href="author.html">Build activities</a> &nbsp;·&nbsp; <a href="dashboard.html">Teacher reports</a></footer>
</div>

<script src="content.js"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var SUPA_URL='https://lhmwtfyceilgndpygivj.supabase.co';
var SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxobXd0ZnljZWlsZ25kcHlnaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMzk5MDIsImV4cCI6MjA5MTcxNTkwMn0.0uIXyctHMfTN4doWYn2JJ260swD5b-t0T-oDMSIPtBU';
var TOOLS=[
  ['combine','◎','Put sentences together'],
  ['write','✎','Rewrite a sentence'],
  ['blank','▭','Fill the gap'],
  ['proof','⚑','Find the mistakes']
];

function loadContent(){
  return fetch(SUPA_URL+'/rest/v1/qf_activities?select=id,payload,published&limit=500',
    {headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}})
    .then(function(r){return r.json();})
    .then(function(rows){
      if(!Array.isArray(rows)||!rows.length) return;
      var meta=null, acts=[];
      rows.forEach(function(r){
        if(r.id==='__meta__'){ meta=r.payload; return; }
        if(r.published===false) return;
        if(r.payload) acts.push(r.payload);
      });
      if(!acts.length) return;
      if(meta&&meta.order){
        var byId={}; acts.forEach(function(a){byId[a.id]=a;});
        var sorted=[]; meta.order.forEach(function(id){if(byId[id]){sorted.push(byId[id]);delete byId[id];}});
        Object.keys(byId).forEach(function(k){sorted.push(byId[k]);});
        acts=sorted;
      }
      window.QF_CONTENT={
        meta:(meta&&meta.meta)||QF_CONTENT.meta,
        skills:(meta&&meta.skills)||QF_CONTENT.skills||{},
        activities:acts
      };
    })
    .catch(function(){});
}

function paint(){
  document.getElementById('ttl').textContent=QF_CONTENT.meta.title;
  document.getElementById('sub').textContent=QF_CONTENT.meta.subtitle||'';
  var html='';
  TOOLS.forEach(function(t){
    var acts=QF_CONTENT.activities.filter(function(a){return a.tool===t[0];});
    if(!acts.length) return;
    html+='<h2>'+esc(t[2])+'</h2>';
    acts.forEach(function(a){
      var skill=(QF_CONTENT.skills&&QF_CONTENT.skills[a.skill])||a.skill||'';
      html+='<a class="act" href="play.html?a='+encodeURIComponent(a.id)+'">'
        +'<span class="mark">'+t[1]+'</span>'
        +'<span><span class="t">'+esc(a.title)+'</span><br><span class="m">'+esc(skill)+' · '+a.prompts.length+' question'+(a.prompts.length===1?'':'s')+'</span></span>'
        +'<span class="lv">'+esc(a.level||'')+'</span></a>';
    });
  });
  document.getElementById('list').innerHTML=html||'<p style="color:var(--muted)">No activities yet.</p>';
}

loadContent().then(paint);
</script>
</body>
</html>
